[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mlserve"
version = "0.1.0"
description = "End-to-end production ML platform: train, optimize, serve, evaluate, monitor"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hariprasadreddy Peddireddy" }]
keywords = ["machine-learning", "mlops", "model-serving", "rag", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "torch>=2.5",
    "transformers>=4.46",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "langchain>=0.3",
    "langgraph>=0.2",
    "faiss-cpu>=1.9",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "pyspark>=3.5",
    "pandas>=2.2",
    "numpy>=2.1",
    "mlflow>=2.18",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "prometheus-client>=0.20",
    "rank-bm25>=0.2",
    "sentence-transformers>=3.2",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[project.scripts]
mlserve-train = "training.trainer:main"
mlserve-serve = "serving.app:run"
mlserve-evaluate = "evaluation.ci_gate:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
